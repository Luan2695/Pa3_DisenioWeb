<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente Amarillo Industrial -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>
    
    <!-- Gradiente Gris Metal / Construcción -->
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333A42" />
      <stop offset="100%" stop-color="#1E2229" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO: Isologo de la 'M' estilo maquinaria / excavadora -->
  <g id="isotipo" transform="translate(10, 0)">
    <!-- Base / Oruga de la maquinaria -->
    <rect x="30" y="150" width="110" height="18" rx="9" fill="#1E2229" />
    <circle cx="45" cy="159" r="5" fill="#FFD000" />
    <circle cx="65" cy="159" r="5" fill="#FFD000" />
    <circle cx="85" cy="159" r="5" fill="#FFD000" />
    <circle cx="105" cy="159" r="5" fill="#FFD000" />
    <circle cx="125" cy="159" r="5" fill="#FFD000" />

    <!-- Columna izquierda de la M (Torre / Estructura) -->
    <path d="M 40 145 L 40 60 L 62 60 L 62 145 Z" fill="url(#darkGrad)" />

    <!-- Brazo Articulado (Forma la V central de la M) -->
    <path d="M 62 60 L 95 110 L 125 45 L 145 55 L 110 130 L 90 130 L 62 85 Z" fill="url(#yellowGrad)" />
    
    <!-- Cuchara / Balde de Excavadora (Cierra el extremo derecho de la M) -->
    <path d="M 125 45 L 155 35 L 165 65 L 140 75 Z" fill="url(#darkGrad)" />
    <!-- Dientes del balde -->
    <polygon points="155,35 160,28 163,33" fill="#FFD000" />
    <polygon points="160,33 165,26 168,31" fill="#FFD000" />

    <!-- Perno / Articulación central -->
    <circle cx="95" cy="110" r="4" fill="#FFFFFF" />
    <circle cx="125" cy="45" r="4" fill="#FFFFFF" />
  </g>

  <!-- LOGOTIPO: Texto MaquiMark -->
  <g id="logotipo">
    <!-- "Maqui" en gris oscuro resistente -->
    <text x="195" y="115" 
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-size="52" 
          font-weight="900" 
          fill="#1E2229" 
          letter-spacing="-1">Maqui</text>
    
    <!-- "Mark" en amarillo industrial con énfasis -->
    <text x="355" y="115" 
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-size="52" 
          font-weight="900" 
          fill="url(#yellowGrad)" 
          letter-spacing="-1">Mark</text>

    <!-- Slogan / Bajada Actualizada -->
    <text x="198" y="142" 
          font-family="'Segoe UI', 'Helvetica', sans-serif" 
          font-size="11.5" 
          font-weight="700" 
          fill="#64748B" 
          letter-spacing="1">MAQUINARIA Y EQUIPOS DE CONSTRUCCIÓN</text>
          
    <!-- Línea decorativa inferior -->
    <rect x="198" y="152" width="370" height="4" fill="url(#yellowGrad)" rx="2" />
  </g>
</svg>
